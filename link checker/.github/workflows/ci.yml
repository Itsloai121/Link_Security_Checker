name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check src tests scripts
      - run: python scripts/export_schemas.py --check
      - run: python scripts/export_openapi.py --check
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit bandit
      - name: Known-vulnerable dependencies
        run: pip-audit -r requirements.lock
      - name: Static security analysis
        run: bandit -r src -ll -q
      - name: Secret scan (no committed .env or keys)
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then echo "secret-like file is tracked"; exit 1; fi
