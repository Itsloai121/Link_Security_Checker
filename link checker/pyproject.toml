[project]
name = "unmask"
version = "1.0.0"
description = "Link security checker: follows a link without opening it in your browser and runs 20 tests to expose phishing, hidden redirects and look-alike domains."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpcore>=1.0.5",
  "dnspython>=2.6",
  "cryptography>=42",
  "beautifulsoup4>=4.12",
  "idna>=3.7",
  "tldextract>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*starlette.testclient.*"]
markers = ["slow: end-to-end tests that start local servers"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "E702", "E731", "E741", "B008", "UP037", "S101", "S105", "S311", "S110", "S112", "S608", "I001", "UP017", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]
