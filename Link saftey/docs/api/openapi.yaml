# OpenAPI 3.1 — Link Safety API
openapi: 3.1.0
info:
  title: Link Safety API
  version: 1.0.0
  description: URL structure analysis, bounded public HTTP/HTTPS inspection, and short-lived report storage. The service does not execute page scripts.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/scans:
    post:
      operationId: createScan
      summary: Analyze a URL and create a short-lived report
      description: Returns an opaque bearer token once. Do not log or share it publicly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  minLength: 1
                  maxLength: 4096
      responses:
        '201':
          description: Analysis completed and report stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScanResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /api/v1/scans/{scan_id}:
    get:
      operationId: getScan
      summary: Retrieve a scan report
      security:
        - reportToken: []
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Stored report. Original URL path/query are deliberately omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredScanReport'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/analyze:
    post:
      operationId: analyzeLegacy
      deprecated: true
      summary: Compatibility route for the bundled GUI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: Analysis response compatible with the existing browser UI.
        '400':
          description: Validation error in the legacy `{ error: string }` shape.
  /health/live:
    get:
      operationId: live
      summary: Process liveness
      responses:
        '200': { description: Process is alive. }
  /health/ready:
    get:
      operationId: ready
      summary: SQLite readiness
      responses:
        '200': { description: Database is ready. }
components:
  securitySchemes:
    reportToken:
      type: http
      scheme: bearer
      bearerFormat: 256-bit random hex token
  schemas:
    Check:
      type: object
      required: [id, title, description, status, detail]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [clear, warning, pending, error, blocked] }
        detail: { type: string }
    CreateScanResponse:
      type: object
      required: [scan_id, access_token, host, score, verdict, checks, summary]
      properties:
        scan_id: { type: string, format: uuid }
        access_token: { type: string, description: Returned once; store it securely if retrieval is needed. }
        normalized: { type: string, description: Present in create response only; not persisted. }
        host: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        verdict: { type: string, enum: [high, caution, incomplete, clear] }
        summary: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/Check' }
        request_id: { type: string, format: uuid }
    StoredScanReport:
      type: object
      required: [id, host, scheme, score, verdict, summary, analyzer_version, created_at, checks]
      properties:
        id: { type: string, format: uuid }
        host: { type: string }
        scheme: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        verdict: { type: string, enum: [high, caution, incomplete, clear] }
        summary: { type: string }
        analyzer_version: { type: string }
        created_at: { type: string, format: date-time }
        checks:
          type: array
          items: { $ref: '#/components/schemas/Check' }
        request_id: { type: string, format: uuid }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string, format: uuid }
            details: { type: array, items: { type: object } }
  responses:
    ApiError:
      description: Safe structured error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
